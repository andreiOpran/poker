<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Neon Hold'em</title>
  <meta name="description" content="Balatro-style Texas Hold'em vs bots." />

  <!-- PWA / iOS standalone -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#06140e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Neon Hold'em" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;700;800&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- SETUP SCREEN -->
    <section id="setup" class="screen active">
      <div class="setup-card">
        <h1 class="logo">NEON<br /><span>HOLD'EM</span></h1>
        <p class="tagline">No-Limit Texas Hold'em · you vs the bots</p>

        <div class="field">
          <label>Starting chips</label>
          <div class="seg" id="opt-chips" data-default="1000">
            <button data-val="500">500</button>
            <button data-val="1000" class="on">1K</button>
            <button data-val="2500">2.5K</button>
            <button data-val="5000">5K</button>
          </div>
        </div>

        <div class="field">
          <label>Opponents</label>
          <div class="seg" id="opt-opponents" data-default="3">
            <button data-val="1">1</button>
            <button data-val="2">2</button>
            <button data-val="3" class="on">3</button>
            <button data-val="4">4</button>
          </div>
        </div>

        <div class="field">
          <label>Bot difficulty</label>
          <div class="seg" id="opt-difficulty" data-default="medium">
            <button data-val="easy">Easy</button>
            <button data-val="medium" class="on">Medium</button>
            <button data-val="hard">Hard</button>
          </div>
        </div>

        <div class="field">
          <label>Blinds</label>
          <div class="seg" id="opt-blinds" data-default="med">
            <button data-val="low">Low</button>
            <button data-val="med" class="on">Normal</button>
            <button data-val="high">High</button>
          </div>
          <div class="blinds-readout" id="blinds-readout">Blinds 10 / 20</div>
        </div>

        <button id="deal-btn" class="btn btn-gold btn-jumbo">DEAL ME IN</button>
      </div>
    </section>

    <!-- TABLE SCREEN -->
    <section id="table" class="screen">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn" aria-label="Menu">☰</button>
        <div class="hand-no" id="hand-no">Hand #1</div>
        <div class="spacer"></div>
      </header>

      <div class="felt">
        <div class="opponents" id="opponents"></div>

        <div class="center">
          <div class="pot" id="pot"><span class="pot-chip"></span><span id="pot-val">0</span></div>
          <div class="board" id="board"></div>
          <div class="banner" id="banner"></div>
        </div>

        <div class="hero" id="hero"></div>
      </div>

      <div class="actionbar" id="actionbar"></div>
    </section>

    <!-- OVERLAY (modals: rebuy, game over, menu) -->
    <div id="overlay" class="overlay"></div>
  </div>

  <script type="module" src="src/main.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () =>
        navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
